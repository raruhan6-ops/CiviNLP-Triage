[project]
name = "civinlp-triage"
version = "0.1.0"
description = "A reproducible NLP decision-support tool for road and bridge maintenance prioritization."
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "pandas>=2.0.0,<3.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.24.0",
    "pydantic>=2.0.0",
    "pyarrow>=12.0.0",
    "geopy>=2.3.0",
    "shapely>=2.0.0",
    "hydra-core>=1.3.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']
