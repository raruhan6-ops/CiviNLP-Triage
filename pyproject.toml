[project]
name = "civinlp-triage"
version = "1.0.0"
description = "Out-of-time evaluation of 311 road-maintenance triage, with a reproducible ranking pipeline, dashboard and API."
authors = [
    {name = "Rejuan Ahmed Ruhan", email = "ra.ruhan6@gmail.com"},
    {name = "Shanjana Dil Afruz"},
]
dependencies = [
    "pandas>=2.0.0,<3.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.46.0",  # width="stretch"
    "pydantic>=2.0.0",
    "pyarrow>=12.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",  # fastapi.testclient
    # Pinned so new releases (e.g. ruff's wider default rule set) don't break CI
    "ruff>=0.17,<0.18",
    "black>=26.1,<27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pyflakes, syntax/statement errors and import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 88
target-version = ['py311']
